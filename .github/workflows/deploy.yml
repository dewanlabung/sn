name: Deploy to nkhoj.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main

            # Run pending SQL migrations if they exist
            if [ -f "includes/sql/forums_phase1.sql" ]; then
              echo "Running forum migration..."
              mysql -u alphaome_nkhojfm -p${{ secrets.DB_PASSWORD }} alphaome_nkhojfm < includes/sql/forums_phase1.sql
              if [ $? -eq 0 ]; then
                echo "✅ Forum migration completed"
              else
                echo "⚠️ Forum migration warning (tables may already exist)"
              fi
            fi

            echo "✅ Deployed at $(date)"
